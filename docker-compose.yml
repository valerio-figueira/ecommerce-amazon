services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitrine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitrine}
      POSTGRES_DB: ${POSTGRES_DB:-vitrine}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vitrine} -d ${POSTGRES_DB:-vitrine}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-setup:
    image: node:20-alpine
    working_dir: /app
    profiles: ["setup"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-vitrine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitrine}
      POSTGRES_DB: ${POSTGRES_DB:-vitrine}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
    command: sh -c "npm ci && npm run db:setup"

  web:
    image: node:20-alpine
    working_dir: /app
    profiles: ["web"]
    environment:
      NODE_ENV: development
      WEB_PORT: ${WEB_PORT:-3001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3001}:${WEB_PORT:-3001}"
    volumes:
      - .:/app
    command: sh -c "npm ci && npm run dev -w @ecommerce-amazon/web"

volumes:
  postgres_data:
  redis_data:
