# Docker Swarm stack — vitrine MVP (subdomínios api./admin. ou paths /api, /admin em fase IP).
# Renderizado por deploy/scripts/deploy.sh via envsubst antes de `docker stack deploy`.
#
# Variáveis *_YAML — deploy/scripts/stack-env-escape.sh (envsubst seguro para segredos).

version: '3.8'

services:
  traefik:
    image: traefik:v2.11
    command:
      # Config estática montada do host (http ou https conforme TLS_ENABLED).
      - '--configFile=/etc/traefik/traefik.yml'
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      # Porta 443 só é publicada quando TLS_ENABLED=true (deploy.sh ajusta o stack renderizado).
      ${TRAEFIK_HTTPS_PORT_BLOCK}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/vitrine/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - vitrine_net
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER_YAML}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_YAML}
      POSTGRES_DB: ${POSTGRES_DB_YAML}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vitrine_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    networks:
      - vitrine_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 96M
      restart_policy:
        condition: on-failure

  api:
    image: "${GHCR_IMAGE_PREFIX}/vitrine-api:${IMAGE_TAG}"
    environment:
      NODE_ENV: production
      API_PORT: '3000'
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER_YAML}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_YAML}
      POSTGRES_DB: ${POSTGRES_DB_YAML}
      DATABASE_URL: ${DATABASE_URL_YAML}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_URL: ${REDIS_URL_YAML}
      REDIS_CACHE_DB: "${REDIS_CACHE_DB}"
      REDIS_QUEUE_DB: "${REDIS_QUEUE_DB}"
      REDIS_TELEMETRY_DB: "${REDIS_TELEMETRY_DB}"
      CORS_ORIGINS: ${CORS_ORIGINS_YAML}
      JWT_SECRET: ${JWT_SECRET_YAML}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN_YAML}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER_YAML}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY_YAML}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET_YAML}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL_YAML}
      WEB_INTERNAL_URL: ${WEB_INTERNAL_URL_YAML}
      SITE_NAME: ${SITE_NAME_YAML}
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME_YAML}
      CONTACT_EMAIL: ${CONTACT_EMAIL_YAML}
      SITE_TAGLINE: ${SITE_TAGLINE_YAML}
      AMAZON_AFFILIATE_TAG: ${AMAZON_AFFILIATE_TAG_YAML}
      SHOPEE_AFFILIATE_ID: ${SHOPEE_AFFILIATE_ID_YAML}
      EMAIL_FROM: ${EMAIL_FROM_YAML}
      RESEND_API_KEY: ${RESEND_API_KEY_YAML}
      STORAGE_DRIVER: "${STORAGE_DRIVER}"
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL_YAML}
      STORAGE_LOCAL_ROOT: /app/uploads
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-}"
      AWS_S3_REGION: "${AWS_S3_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID_YAML}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY_YAML}
      GA4_PROPERTY_ID: "${GA4_PROPERTY_ID}"
      GA4_SERVICE_ACCOUNT_JSON: ${GA4_SERVICE_ACCOUNT_JSON_YAML}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - vitrine_net
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_DOCKER_NETWORK}
        ${TRAEFIK_API_ROUTER_LABELS}
        ${TRAEFIK_API_TLS_LABELS}
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
      restart_policy:
        condition: on-failure

  worker:
    image: "${GHCR_IMAGE_PREFIX}/vitrine-worker:${IMAGE_TAG}"
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: ${POSTGRES_USER_YAML}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_YAML}
      POSTGRES_DB: ${POSTGRES_DB_YAML}
      DATABASE_URL: ${DATABASE_URL_YAML}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_URL: ${REDIS_URL_YAML}
      REDIS_CACHE_DB: "${REDIS_CACHE_DB}"
      REDIS_QUEUE_DB: "${REDIS_QUEUE_DB}"
      REDIS_TELEMETRY_DB: "${REDIS_TELEMETRY_DB}"
      TELEMETRY_BUFFER_ENABLED: "${TELEMETRY_BUFFER_ENABLED}"
      TELEMETRY_FLUSH_BATCH_SIZE: "${TELEMETRY_FLUSH_BATCH_SIZE}"
      TELEMETRY_FLUSH_CRON: "${TELEMETRY_FLUSH_CRON}"
      TELEMETRY_BUFFER_MAX_LEN: "${TELEMETRY_BUFFER_MAX_LEN}"
      JWT_SECRET: ${JWT_SECRET_YAML}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER_YAML}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY_YAML}
      AMAZON_AFFILIATE_TAG: ${AMAZON_AFFILIATE_TAG_YAML}
      SHOPEE_AFFILIATE_ID: ${SHOPEE_AFFILIATE_ID_YAML}
      EMAIL_FROM: ${EMAIL_FROM_YAML}
      RESEND_API_KEY: ${RESEND_API_KEY_YAML}
      STORAGE_DRIVER: "${STORAGE_DRIVER}"
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL_YAML}
      STORAGE_LOCAL_ROOT: /app/uploads
      AWS_S3_BUCKET: "${AWS_S3_BUCKET:-}"
      AWS_S3_REGION: "${AWS_S3_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID_YAML}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY_YAML}
    networks:
      - vitrine_net
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
      restart_policy:
        condition: on-failure

  web:
    image: "${GHCR_IMAGE_PREFIX}/vitrine-web:${IMAGE_TAG}"
    environment:
      NODE_ENV: production
      HOSTNAME: '0.0.0.0'
      WEB_PORT: '3001'
      PORT: '3001'
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL_YAML}
      WEB_INTERNAL_URL: ${WEB_INTERNAL_URL_YAML}
      SITE_NAME: ${SITE_NAME_YAML}
      NEXT_PUBLIC_SITE_NAME: ${SITE_NAME_YAML}
      NEXT_PUBLIC_SITE_URL: ${WEB_PUBLIC_URL_YAML}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET_YAML}
      COMPANY_LEGAL_NAME: ${COMPANY_LEGAL_NAME_YAML}
      CONTACT_EMAIL: ${CONTACT_EMAIL_YAML}
      SITE_TAGLINE: ${SITE_TAGLINE_YAML}
    networks:
      - vitrine_net
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_DOCKER_NETWORK}
        ${TRAEFIK_WEB_ROUTER_LABELS}
        ${TRAEFIK_WEB_TLS_LABELS}
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
      restart_policy:
        condition: on-failure

  admin:
    image: "${GHCR_IMAGE_PREFIX}/vitrine-admin:${IMAGE_TAG}"
    environment:
      NODE_ENV: production
      HOSTNAME: '0.0.0.0'
      ADMIN_PORT: '3002'
      PORT: '3002'
      API_INTERNAL_URL: ${API_INTERNAL_URL_YAML}
      JWT_SECRET: ${JWT_SECRET_YAML}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN_YAML}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL_YAML}
      SITE_NAME: ${SITE_NAME_YAML}
      NEXT_PUBLIC_SITE_NAME: ${SITE_NAME_YAML}
      NEXT_PUBLIC_SITE_URL: ${WEB_PUBLIC_URL_YAML}
      SITE_TAGLINE: ${SITE_TAGLINE_YAML}
    networks:
      - vitrine_net
    deploy:
      replicas: 1
      labels:
        - traefik.enable=true
        - traefik.docker.network=${TRAEFIK_DOCKER_NETWORK}
        ${TRAEFIK_ADMIN_ROUTER_LABELS}
        ${TRAEFIK_ADMIN_TLS_LABELS}
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M
      restart_policy:
        condition: on-failure

networks:
  vitrine_net:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  traefik_letsencrypt:
