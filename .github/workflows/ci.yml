# CI em pull requests — qualidade sem build/deploy de imagens.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitrine
          POSTGRES_PASSWORD: vitrine
          POSTGRES_DB: vitrine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitrine -d vitrine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: vitrine
      POSTGRES_PASSWORD: vitrine
      POSTGRES_DB: vitrine
      REDIS_HOST: localhost
      REDIS_PORT: 6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages for lint and tests
        run: |
          npm run build -w @ecommerce-amazon/domain
          npm run build -w @ecommerce-amazon/shared

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Prepare integration test database
        run: npm run db:migrate -w @ecommerce-amazon/infrastructure

      - name: Integration tests
        run: npm run test:integration
